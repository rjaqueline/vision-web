<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Teste de Detecção — YuNet</title>
<style>
  body { font-family: sans-serif; padding: 32px; max-width: 700px; margin: 0 auto; }
  #status { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  canvas { max-width: 100%; border: 1px solid #ccc; margin-top: 16px; }
  input[type="file"] { margin-top: 16px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <h1>Teste: YuNet detectando um rosto de verdade</h1>
  <p id="status">⏳ Carregando OpenCV.js...</p>
  
  <input type="file" id="arquivo" accept="image/*" disabled />
<button id="processar" disabled>Processar imagem</button>
<br />
   <canvas id="saida"></canvas>
   <h3>Recorte final (200x267):</h3>
   <canvas id="recorte"></canvas>
   <br />
   <button id="baixar" disabled>Baixar recorte</button>
   <hr />
   <h2>Lote (varias fotos)</h2>
   <input type="file" id="arquivosLote" accept="image/*" multiple disabled />
   <button id="processarLote" disabled>Processar lote e baixar ZIP</button>
   <p id="statusLote"></p>
   <hr />
   <h2>PDF (rasteriza a pagina 1)</h2>
   <input type="file" id="arquivoPdf" accept="application/pdf" disabled />
   <p id="statusPdf"></p>

  <script type="module">
    import { calcularJanela, arredondarJanela, CALIBRAGEM_PADRAO } from '/src/geometria.ts';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    window.Module = {
      onRuntimeInitialized() {
        iniciar();
      }
    };

    let detector = null;
    let imagemSelecionada = null;
    let nomeArquivo = 'recorte';

    async function iniciar() {
      const status = document.getElementById('status');
      status.textContent = '⏳ Baixando o modelo YuNet (.onnx)...';

      try {
        const resposta = await fetch('/models/face_detection_yunet_2023mar.onnx');
        const buffer = await resposta.arrayBuffer();
        const dados = new Uint8Array(buffer);
        cv.FS_createDataFile('/', 'face_detection_yunet_2023mar.onnx', dados, true, false, false);

        detector = new cv.FaceDetectorYN(
          'face_detection_yunet_2023mar.onnx',
          '',
          new cv.Size(320, 320),
          0.9,   // limiar de confiança (score threshold)
          0.3,   // limiar do NMS (remove caixas duplicadas sobre o mesmo rosto)
          5000   // top-K (quantas candidatas considerar antes de filtrar)
        );

        status.textContent = '✅ Pronto! Escolha uma foto com um rosto.';
        document.getElementById('arquivo').disabled = false;
        document.getElementById('arquivosLote').disabled = false;
        document.getElementById('processarLote').disabled = false;
        document.getElementById('arquivoPdf').disabled = false;
      } catch (e) {
        status.textContent = '⚠️ Erro ao carregar o modelo: ' + e.message;
      }
    }

    document.getElementById('arquivo').addEventListener('change', (evento) => {
      const arquivo = evento.target.files[0];
      if (!arquivo) return;
      nomeArquivo = arquivo.name.replace(/\.[^.]+$/, '');

      const imagem = new Image();
      imagem.onload = () => {
        imagemSelecionada = imagem;
        document.getElementById('processar').disabled = false;
      };
      imagem.src = URL.createObjectURL(arquivo);
    });

    document.getElementById('processar').addEventListener('click', () => {
      processarImagem(imagemSelecionada);
    });

    document.getElementById('arquivoPdf').addEventListener('change', async (evento) => {
      const arquivo = evento.target.files[0];
      if (!arquivo) return;
      nomeArquivo = arquivo.name.replace(/\.[^.]+$/, '');

      const statusPdf = document.getElementById('statusPdf');
      statusPdf.textContent = 'Lendo PDF...';

      const buffer = await arquivo.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 2.78 }); // ~200 DPI (72 * 2.78)

      const canvasPdf = document.createElement('canvas');
      canvasPdf.width = viewport.width;
      canvasPdf.height = viewport.height;
      await page.render({ canvasContext: canvasPdf.getContext('2d'), viewport }).promise;

      statusPdf.textContent = 'PDF renderizado, processando rosto...';
      processarImagem(canvasPdf);
    });

    document.getElementById('baixar').addEventListener('click', () => {
      const canvasRecorte = document.getElementById('recorte');
      canvasRecorte.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = nomeArquivo + '_cracha.png';
        link.click();
        URL.revokeObjectURL(url);
      }, 'image/png');
    });

    function carregarImagem(arquivo) {
      return new Promise((resolve, reject) => {
        const imagem = new Image();
        imagem.onload = () => resolve(imagem);
        imagem.onerror = reject;
        imagem.src = URL.createObjectURL(arquivo);
      });
    }

    function canvasParaBlob(canvas) {
      return new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
    }

    document.getElementById('processarLote').addEventListener('click', async () => {
      const statusLote = document.getElementById('statusLote');
      const arquivos = document.getElementById('arquivosLote').files;
      if (arquivos.length === 0) {
        statusLote.textContent = 'Escolha ao menos uma foto.';
        return;
      }

      const zip = new JSZip();
      const pastaAprovadas = zip.folder('aprovadas');
      const pastaRevisar = zip.folder('revisar');
      const linhasCsv = ['arquivo,status,motivo,confianca,deslizou,encolheu'];

      let aprovadas = 0;
      let revisar = 0;

      for (let i = 0; i < arquivos.length; i++) {
        const arquivo = arquivos[i];
        const nome = arquivo.name.replace(/\.[^.]+$/, '');
        statusLote.textContent = `Processando ${i + 1} de ${arquivos.length}...`;

        const imagem = await carregarImagem(arquivo);
        const r = recortarFoto(imagem);

        if (r.ok) {
          const blob = await canvasParaBlob(r.canvasRecorte);
          pastaAprovadas.file(nome + '_cracha.png', blob);
          linhasCsv.push(`${arquivo.name},aprovada,,${r.score.toFixed(3)},${r.diagnostico.deslizou},${r.diagnostico.encolheu}`);
          aprovadas++;
        } else {
          pastaRevisar.file(arquivo.name, arquivo);
          linhasCsv.push(`${arquivo.name},revisar,${r.motivo},,,`);
          revisar++;
        }
      }

      zip.file('relatorio.csv', linhasCsv.join('\n'));

      statusLote.textContent = `Gerando ZIP... (${aprovadas} aprovadas, ${revisar} para revisar)`;
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(zipBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'vision_lote.zip';
      link.click();
      URL.revokeObjectURL(url);

      statusLote.textContent = `Concluido! ${aprovadas} aprovadas, ${revisar} para revisar.`;
    });

    function recortarFoto(imagem) {
  const LADO_MAXIMO = 800;
  const escala = Math.min(1, LADO_MAXIMO / Math.max(imagem.width, imagem.height));

  const canvasEntrada = document.createElement('canvas');
  canvasEntrada.width = Math.round(imagem.width * escala);
  canvasEntrada.height = Math.round(imagem.height * escala);
  canvasEntrada.getContext('2d').drawImage(imagem, 0, 0, canvasEntrada.width, canvasEntrada.height);

  const img = cv.imread(canvasEntrada);
  cv.cvtColor(img, img, cv.COLOR_RGBA2BGR);
  const faces = new cv.Mat();
  detector.setInputSize(new cv.Size(img.cols, img.rows));
  detector.detect(img, faces);

  let resultadoFinal;

  if (faces.rows === 0) {
    resultadoFinal = { ok: false, motivo: 'nenhum_rosto', detalhe: '' };
  } else {
    const x = faces.data32F[0];
    const y = faces.data32F[1];
    const w = faces.data32F[2];
    const h = faces.data32F[3];
    const score = faces.data32F[14];
    const rosto = { x, y, largura: w, altura: h };
    const dimensoesImagem = { largura: img.cols, altura: img.rows };
    const resultado = calcularJanela(rosto, dimensoesImagem, CALIBRAGEM_PADRAO);

    if (!resultado.ok) {
      resultadoFinal = { ok: false, motivo: resultado.motivo, detalhe: resultado.detalhe };
    } else {
      const janela = arredondarJanela(resultado.janela, dimensoesImagem);
      const ox = Math.round(janela.x / escala);
      const oy = Math.round(janela.y / escala);
      const ow = Math.round(janela.largura / escala);
      const oh = Math.round(janela.altura / escala);

      const canvasRecorte = document.createElement('canvas');
      canvasRecorte.width = 200;
      canvasRecorte.height = 267;
      canvasRecorte.getContext('2d').drawImage(imagem, ox, oy, ow, oh, 0, 0, 200, 267);

      resultadoFinal = { ok: true, canvasRecorte, diagnostico: resultado.diagnostico, score };
    }
  }

  img.delete();
  faces.delete();
  return resultadoFinal;
}

    function processarImagem(imagem) {
  const status = document.getElementById('status');
  document.getElementById('baixar').disabled = true;

  const r = recortarFoto(imagem);

  const canvasRecorte = document.getElementById('recorte');
  if (r.ok) {
    canvasRecorte.width = 200;
    canvasRecorte.height = 267;
    canvasRecorte.getContext('2d').drawImage(r.canvasRecorte, 0, 0);
    document.getElementById('baixar').disabled = false;
    status.textContent = `Aprovada (confianca ${r.score.toFixed(3)}) ` +
      `(deslizou: ${r.diagnostico.deslizou}, encolheu: ${r.diagnostico.encolheu})`;
  } else {
    status.textContent = `Recusada: ${r.motivo}` + (r.detalhe ? ` — ${r.detalhe}` : '');
  }
}

    const scriptOpenCV = document.createElement('script');
    scriptOpenCV.src = 'https://docs.opencv.org/4.x/opencv.js';
    scriptOpenCV.async = true;
    document.body.appendChild(scriptOpenCV);
  </script>
</body>
</html>
